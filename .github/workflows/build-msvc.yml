name: build-msvc
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths: ['fotonvoice-src/**', '.github/workflows/build-msvc.yml']

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: fotonvoice-src/fotonvoice-engine-0.5.8
    env:
      # Baked into the binary and reported by `--version`, so any artifact from
      # this workflow can say exactly which commit produced it.
      FOTONVOICE_BUILD_SHA: ${{ github.sha }}
      # THE fix for STATUS_ILLEGAL_INSTRUCTION (0xc000001d) on AVX-512-less
      # CPUs such as the Intel Core Ultra 5 226V. ggml defaults
      # GGML_NATIVE=ON, which passes -march=native, so on this AVX-512 runner
      # it compiled AVX-512 into a binary bound for machines that cannot run it
      # (5092 EVEX instructions, confirmed by disassembly). ggml's CMakeLists
      # sets GGML_NATIVE_DEFAULT=OFF when SOURCE_DATE_EPOCH is defined, which
      # is its own reproducible-build hook, so this needs no patched crate.
      # Verified: GGML_NATIVE=ON and "-march=native" without it, OFF with it.
      SOURCE_DATE_EPOCH: "1"
      # Not the cause of the AVX-512 problem (rustc baseline x86-64 is sse2
      # only, per `rustc --print cfg`), but kept as defence in depth so a
      # future toolchain default cannot reintroduce it.
      RUSTFLAGS: -C target-feature=-avx512f,-avx512bw,-avx512cd,-avx512dq,-avx512vl,-avx512ifma,-avx512vbmi,-avx512vbmi2,-avx512vnni,-avx512bitalg,-avx512vpopcntdq
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fotonvoice-src/fotonvoice-engine-0.5.8

      - name: Frontend (vite)
        run: |
          npm ci
          npm run build

      - name: Build (msvc, WebGPU features)
        run: cargo build --release -p fotonvoice-app --features moonshine-webgpu,nemotron-streaming-webgpu

      - name: Collect
        run: |
          New-Item -ItemType Directory -Force -Path publish | Out-Null
          Copy-Item target\release\fotonvoice-engine.exe publish\
          Copy-Item target\release\fotonvoice-llm-sidecar.exe publish\ -ErrorAction SilentlyContinue

      - name: Verify no AVX-512 (portability gate)
        shell: bash
        run: |
          # github.workspace expands to a Windows path (D:\a\...), and bash eats
          # the backslashes, so convert to forward slashes before using it.
          script="${{ github.workspace }}/.github/scripts/check-avx512.py"
          script="${script//\\//}"
          python "$script" target/release/fotonvoice-engine.exe

      - uses: actions/upload-artifact@v4
        with:
          name: fotonvoice-msvc-webgpu
          path: fotonvoice-src/fotonvoice-engine-0.5.8/publish/
          # 500 MB account quota: two weeks is enough for a manual download.
          retention-days: 14

  # Vulkan lane, mirroring build-linux.yml's Vulkan approach: whisper.cpp
  # compiles with the ggml Vulkan backend, so Whisper accelerates on
  # NVIDIA, AMD and Intel GPUs. Nothing extra ships with the exe: the host
  # GPU driver carries the vulkan-1.dll loader at runtime. glslc, which the
  # ggml Vulkan backend needs at build time to compile its shaders, comes
  # from the LunarG SDK installed here (the windows-latest runner image has
  # CMake and MSVC but no Vulkan SDK).
  build-vulkan:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: fotonvoice-src/fotonvoice-engine-0.5.8
    timeout-minutes: 90
    env:
      FOTONVOICE_BUILD_SHA: ${{ github.sha }}
      # ggml's vulkan-shaders-gen re-runs a bare cmake configure for its host
      # tool, and that fails compiler discovery under the runner's VS 2026
      # (v180) toolset ("No CMAKE_C_COMPILER could be found"; also whisper.cpp
      # #3973, llama.cpp #8562). Force Ninja for both the whisper-rs-sys build
      # and the nested configure; cmake-rs reads this env var, and bare cmake
      # runs default to it. The compiler then comes from PATH, which the
      # msvc-dev-cmd step below populates with cl.exe.
      CMAKE_GENERATOR: Ninja
      # The default target dir nests ~200 extra path chars; combined with the
      # workspace prefix the vulkan-shaders-gen ExternalProject configure
      # crosses the 260-char MAX_PATH wall and cl.exe dies with C1083 on the
      # TryCompile scratch file. A short root-level target dir stays under it.
      CARGO_TARGET_DIR: D:\a\wt\tgt
      # Same reason as the webgpu job: the runner has AVX-512, the target may
      # not. ggml reads SOURCE_DATE_EPOCH to turn off GGML_NATIVE, which is
      # what passes -march=native and emits the AVX-512 instructions.
      SOURCE_DATE_EPOCH: "1"
      RUSTFLAGS: -C target-feature=-avx512f,-avx512bw,-avx512cd,-avx512dq,-avx512vl,-avx512ifma,-avx512vbmi,-avx512vbmi2,-avx512vnni,-avx512bitalg,-avx512vpopcntdq
    steps:
      - uses: actions/checkout@v4

      - name: Enable MSVC dev environment (cl.exe on PATH)
        uses: ilammy/msvc-dev-cmd@v1.13.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fotonvoice-src/fotonvoice-engine-0.5.8
          key: msvc-vulkan

      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          choco install vulkan-sdk --version 1.4.350 -y --no-progress
          $sdk = Get-ChildItem C:\VulkanSDK -Directory | Sort-Object Name -Descending | Select-Object -First 1
          "VULKAN_SDK=$($sdk.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          Add-Content -Path $env:GITHUB_PATH -Value "$($sdk.FullName)\Bin"
          & "$($sdk.FullName)\Bin\glslc.exe" --version

      - name: Frontend (vite)
        run: |
          npm ci
          npm run build

      - name: Build (msvc, WebGPU + Vulkan features)
        run: cargo build --release -p fotonvoice-app --features moonshine-webgpu,nemotron-streaming-webgpu,vulkan

      - name: Collect
        run: |
          New-Item -ItemType Directory -Force -Path publish-vulkan | Out-Null
          Copy-Item $env:CARGO_TARGET_DIR\release\fotonvoice-engine.exe publish-vulkan\
          Copy-Item $env:CARGO_TARGET_DIR\release\fotonvoice-llm-sidecar.exe publish-vulkan\ -ErrorAction SilentlyContinue

      - name: Verify no AVX-512 (portability gate)
        shell: bash
        run: |
          script="${{ github.workspace }}/.github/scripts/check-avx512.py"
          script="${script//\\//}"
          python "$script" "$CARGO_TARGET_DIR/release/fotonvoice-engine.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: fotonvoice-msvc-vulkan
          path: fotonvoice-src/fotonvoice-engine-0.5.8/publish-vulkan/
          # 500 MB account quota: two weeks is enough for a manual download.
          retention-days: 14
