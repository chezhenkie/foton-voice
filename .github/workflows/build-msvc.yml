name: build-msvc
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths: ['fotonvoice-src/**', '.github/workflows/build-msvc.yml']

permissions:
  contents: read

# One job, not two. There used to be a WebGPU-only job alongside this Vulkan
# one, but the Vulkan build is a strict superset: it carries
# nemotron-streaming-webgpu and vulkan, so and
# Nemotron still use WebGPU while Whisper uses the ggml Vulkan backend. The
# WebGPU-only exe was 11 MB against 27 MB for the Vulkan one and existed only
# to prove the WebGPU path compiles, which this job already does. Folding it
# halved CI time and left one artifact to test.
jobs:
  # whisper.cpp compiles with the ggml Vulkan backend, so Whisper accelerates
  # on NVIDIA, AMD and Intel GPUs. Nothing extra ships with the exe: the host
  # GPU driver carries the vulkan-1.dll loader at runtime. glslc, which the
  # ggml Vulkan backend needs at build time to compile its shaders, comes from
  # the LunarG SDK installed here (the windows-latest runner image has CMake
  # and MSVC but no Vulkan SDK).
  build-vulkan:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: fotonvoice-src/fotonvoice-engine-0.5.8
    timeout-minutes: 90
    env:
      # Baked into the binary and reported by `--version`, so any artifact from
      # this workflow can say exactly which commit produced it.
      FOTONVOICE_BUILD_SHA: ${{ github.sha }}
      # ggml's vulkan-shaders-gen re-runs a bare cmake configure for its host
      # tool, and that fails compiler discovery under the runner's VS 2026
      # (v180) toolset ("No CMAKE_C_COMPILER could be found"; also whisper.cpp
      # #3973, llama.cpp #8562). Force Ninja for both the whisper-rs-sys build
      # and the nested configure; cmake-rs reads this env var, and bare cmake
      # runs default to it. The compiler then comes from PATH, which the
      # msvc-dev-cmd step below populates with cl.exe.
      CMAKE_GENERATOR: Ninja
      # THE fix for STATUS_ILLEGAL_INSTRUCTION (0xc000001d) on AVX-512-less
      # CPUs such as the Intel Core Ultra 5 226V, done WITHOUT giving up CPU
      # speed. ggml picks its x86 kernel set from two variables:
      #     if (GGML_NATIVE OR NOT GGML_NATIVE_DEFAULT) -> INS_ENB OFF else ON
      # and GGML_SSE42, GGML_AVX, GGML_AVX2, GGML_BMI2, GGML_FMA and GGML_F16C
      # all default to INS_ENB. Only GGML_NATIVE=ON passes -march=native, which
      # on this AVX-512 runner baked 5092 EVEX instructions into an artifact
      # bound for CPUs that cannot execute them.
      #
      # Do NOT "fix" this with SOURCE_DATE_EPOCH. That makes
      # GGML_NATIVE_DEFAULT=OFF, which lands on the INS_ENB OFF branch as well,
      # and the CPU backend is then compiled with no SIMD at all. That was
      # measured on the target: 3630 ms of audio took 128235 ms to transcribe,
      # real-time factor 0.028, machine stalled under full load.
      #
      # The toolchain file forces GGML_NATIVE=OFF in the cache and leaves
      # GGML_NATIVE_DEFAULT alone, so INS_ENB stays ON and the backend gets
      # SSE4.2, F16C, FMA, BMI2, AVX and AVX2 with nothing above AVX2. On MSVC
      # GGML_AVX2 maps to /arch:AVX2 and GGML_AVX512 is a separate mutually
      # exclusive branch. Verified against the real ggml CMakeLists by
      # configuring it three ways and reading the compiler command lines:
      #   toolchain  -> -msse4.2 -mf16c -mfma -mbmi2 -mavx -mavx2
      #   default    -> -march=native
      #   this fix   -> (none, the stall)
      CMAKE_TOOLCHAIN_FILE: ${{ github.workspace }}\.github\cmake\portable-x86.cmake
      # The -p3 salt exists because whisper-rs-sys never declares
      # rerun-if-env-changed for CMAKE_TOOLCHAIN_FILE or SOURCE_DATE_EPOCH, so
      # a restored rust-cache would silently reuse objects configured with
      # -march=native (AVX-512) or with no SIMD at all. Bump the salt whenever
      # portability-affecting flags change.
      CARGO_TARGET_DIR: D:\a\wt\tgt-p3
      # Not the cause of the AVX-512 problem (rustc baseline x86-64 is sse2
      # only, per `rustc --print cfg`), but kept as defence in depth so a
      # future toolchain default cannot reintroduce it.
      RUSTFLAGS: -C target-feature=-avx512f,-avx512bw,-avx512cd,-avx512dq,-avx512vl,-avx512ifma,-avx512vbmi,-avx512vbmi2,-avx512vnni,-avx512bitalg,-avx512vpopcntdq
    steps:
      - uses: actions/checkout@v4

      - name: Enable MSVC dev environment (cl.exe on PATH)
        uses: ilammy/msvc-dev-cmd@v1.13.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fotonvoice-src/fotonvoice-engine-0.5.8
          key: msvc-vulkan

      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          # Try the pinned version first for reproducibility, but do not let a
          # vanished Chocolatey package version break the whole build. Run
          # 37081236531 failed here with "vulkan-sdk not installed. The package
          # was not found with the source(s) listed" for 1.4.350, before any
          # project code was compiled.
          choco install vulkan-sdk --version 1.4.350 -y --no-progress
          if ($LASTEXITCODE -ne 0) {
            Write-Host "pinned vulkan-sdk 1.4.350 unavailable; installing the newest published" -ForegroundColor Yellow
            choco install vulkan-sdk -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "choco install vulkan-sdk failed" }
            Write-Host "NOTE: built against the newest published Vulkan SDK, not 1.4.350" -ForegroundColor Yellow
          }

          if (-not (Test-Path C:\VulkanSDK)) { throw "C:\VulkanSDK does not exist after install" }
          $sdk = Get-ChildItem C:\VulkanSDK -Directory | Sort-Object Name -Descending | Select-Object -First 1
          "VULKAN_SDK=$($sdk.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          Add-Content -Path $env:GITHUB_PATH -Value "$($sdk.FullName)\Bin"
          Write-Host "using Vulkan SDK $($sdk.Name)" -ForegroundColor Green
          & "$($sdk.FullName)\Bin\glslc.exe" --version

      - name: Frontend (vite)
        run: |
          npm ci
          npm run build

      # cargo rustc (not cargo build) so the extra linker flags reach ONLY the
      # final exe link. /MAP makes the linker write a symbol-by-address map,
      # which the portability gate needs to tell AVX-512 code apart from AVX-512
      # bytes in data: ggml's PULP DSP descriptor tables and onigmo's encoding
      # table decode as EVEX under a linear sweep but are never executed.
      # /MAP needs no debug info, so it also names C++ symbols, which
      # -C debuginfo alone would not.
      - name: Build (msvc, WebGPU + Vulkan features)
        run: >
          cargo rustc --release -p fotonvoice-app --bin fotonvoice-engine
          --features nemotron-streaming-webgpu,vulkan
          -- -C link-arg=/MAP:D:\a\wt\avx.map -C link-arg=/MAPINFO:EXPORTS

      - name: Collect
        run: |
          New-Item -ItemType Directory -Force -Path publish-vulkan | Out-Null
          Copy-Item $env:CARGO_TARGET_DIR\release\fotonvoice-engine.exe publish-vulkan\
          Copy-Item $env:CARGO_TARGET_DIR\release\fotonvoice-llm-sidecar.exe publish-vulkan\ -ErrorAction SilentlyContinue

      # Upload BEFORE the gate. A failing gate must not cost us the binary: the
      # exe is the only way to verify a suspicious gate verdict against real
      # disassembly, which is how the earlier byte-scanning gate went wrong.
      - uses: actions/upload-artifact@v4
        with:
          name: fotonvoice-msvc-vulkan
          path: fotonvoice-src/fotonvoice-engine-0.5.8/publish-vulkan/
          # 500 MB account quota: two weeks is enough for a manual download.
          retention-days: 14

      - name: Verify no AVX-512 (portability gate)
        shell: bash
        run: |
          # github.workspace expands to a Windows path (D:\a\...), and bash eats
          # the backslashes, so convert to forward slashes before using it.
          script="${{ github.workspace }}/.github/scripts/check-avx512.py"
          script="${script//\\//}"
          python "$script" "$CARGO_TARGET_DIR/release/fotonvoice-engine.exe" --map "D:/a/wt/avx.map"