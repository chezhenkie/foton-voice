[package]
name = "fotonvoice-app"
version.workspace = true
edition.workspace = true
default-run = "fotonvoice-engine"

# Windows exe properties (RMB -> Properties -> Details pane). tauri-build
# passes these through tauri-winres into the embedded version resource.
[package.metadata.tauri-winres]
OriginalFilename = "fotonvoice-engine.exe"
FileDescription = "FotonVoice Engine"
ProductName = "FotonVoice Engine"
CompanyName = "fotonvoice"
LegalCopyright = "Copyright (c) 2026 fotonvoice"

[lib]
name = "fotonvoice_app_lib"
crate-type = ["rlib"]

[[bin]]
name = "fotonvoice-engine"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri 2 core
tauri = { version = "2", features = ["tray-icon", "image-ico", "image-png"] }
tauri-plugin-shell     = "2"
tauri-plugin-notification = "2"
tauri-plugin-fs        = "2"
tauri-plugin-dialog    = "2"
dirs                   = { workspace = true }

# Internal crates
fotonvoice-config    = { workspace = true }
fotonvoice-routing   = { workspace = true }
fotonvoice-hotkeys   = { workspace = true }
# `noisereduce` compiles RNNoise in, so the Audio tab's noise-suppression
# toggle has something to switch on.
fotonvoice-audio     = { workspace = true, features = ["noisereduce"] }
fotonvoice-inference = { workspace = true }
fotonvoice-tts       = { workspace = true }
fotonvoice-inject    = { workspace = true }
fotonvoice-dbus      = { workspace = true }
fotonvoice-mcp       = { workspace = true }
fotonvoice-llm       = { workspace = true }
fotonvoice-update    = { workspace = true }

# Runtime and utilities
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# WebView2 fixed-runtime zip extraction (see webview2.rs)
zip = { version = "2", default-features = false, features = ["deflate"] }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
crossbeam-channel = { workspace = true }
chrono = { workspace = true }
tauri-plugin-single-instance = "2.4.2"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
zbus = { workspace = true }
gtk = { version = "0.18", features = ["v3_24"] }

[features]
# Both ONNX-backed engines ship by default: selecting them in Settings should
# work in any build, rather than silently falling back (Moonshine) or leaving
# Test TTS disabled (Inflect). They share one ONNX Runtime, so enabling the
# second costs almost nothing once the first is in.
#
# The trade-off is that a default build now links ONNX Runtime, which is
# fetched at build time - so building requires network access to that host.
# Use `--no-default-features --features custom-protocol` for an offline build
# without either engine.
default = ["custom-protocol", "moonshine", "parakeet", "inflect-micro", "luxtts"]
custom-protocol = ["tauri/custom-protocol"]
cuda = ["fotonvoice-inference/cuda"]
vulkan = ["fotonvoice-inference/vulkan"]
# Compiles the Moonshine ONNX speech-to-text backend into the app. On by
# default; without it a "moonshine" backend selection transparently falls back
# to whisper-cpp.
moonshine = ["fotonvoice-inference/moonshine"]
# GPU offload for Moonshine. Opt-in for the same reason as `cuda`: it needs the
# CUDA runtime at build and run time. Note there is deliberately no Vulkan
# equivalent - ONNX Runtime has none - so the `vulkan` build above accelerates
# whisper.cpp only, and Moonshine stays on the CPU in it.
moonshine-cuda = ["fotonvoice-inference/moonshine-cuda"]
moonshine-coreml = ["fotonvoice-inference/moonshine-coreml"]
# Cross-vendor GPU offload for Moonshine. Unlike `moonshine-cuda` this needs no
# vendor toolchain at build time and nothing extra at run time, so it is what
# the Windows GPU release build uses. See fotonvoice-inference's Cargo.toml for why
# this is WebGPU and not DirectML.
moonshine-webgpu = ["fotonvoice-inference/moonshine-webgpu"]
# Compiles the Parakeet ONNX speech-to-text backend into the app. On by
# default; without it a "parakeet" backend selection falls back to whisper-cpp.
parakeet = ["fotonvoice-inference/parakeet"]
parakeet-cuda = ["fotonvoice-inference/parakeet-cuda"]
parakeet-coreml = ["fotonvoice-inference/parakeet-coreml"]
parakeet-webgpu = ["fotonvoice-inference/parakeet-webgpu"]
# Compiles the Nemotron streaming speech-to-text backend (English, 560ms
# cache-aware chunks) into the app. OFF by default until Phase 2 ships stable;
# without it a "nemotron-streaming" selection falls back to whisper-cpp.
nemotron-streaming = ["fotonvoice-inference/nemotron-streaming"]
nemotron-streaming-cuda = ["nemotron-streaming", "fotonvoice-inference/nemotron-streaming-cuda"]
nemotron-streaming-coreml = ["nemotron-streaming", "fotonvoice-inference/nemotron-streaming-coreml"]
nemotron-streaming-webgpu = ["nemotron-streaming", "fotonvoice-inference/nemotron-streaming-webgpu"]
# Compiles the Inflect-Micro-v2 ONNX text-to-speech engine into the app. On by
# default; without it, selecting the engine reports that the build lacks it
# instead of failing obscurely. Needs `espeak-ng` installed at runtime for
# phonemization either way.
inflect-micro = ["fotonvoice-tts/inflect-micro"]
# Compiles the LuxTTS ONNX text-to-speech engine into the app. On by default,
# same story as `inflect-micro`: one ONNX Runtime shared with the other
# engine, plus rubato/rustfft. Needs `espeak-ng` at runtime for phonemization.
luxtts = ["fotonvoice-tts/luxtts"]

[dev-dependencies]
tempfile = { workspace = true }
